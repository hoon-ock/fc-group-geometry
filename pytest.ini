[pytest]
testpaths = tests
# tests/ imports conftest helpers by module name (from conftest import ...), which needs
# the test directory on sys.path. importmode=prepend with rootdir-relative paths gives that
# without making tests/ a package.
addopts = -q --strict-markers
markers =
    slow: end-to-end; needs --runslow (rebuilds figures, reproduces snapshots)
