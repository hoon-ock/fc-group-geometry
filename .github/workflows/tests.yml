name: tests

# The suite's whole point is that it passes on a FRESH CLONE -- that property was broken
# once (visuals/clustermap/ had no tracked file, so git could not carry the directory) and
# was only caught by cloning the published repo by hand. CI checks out a clean tree on every
# push, so the check that found that bug now runs automatically.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The version the pins were re-derived under, and in which all 29 snapshots and
          # all 70 figures reproduce byte-for-byte.
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # --runslow adds the figures tier, which needs nothing but the repository: it runs all
      # nine generators and asserts exactly 70 PNGs at the right per-topic counts, entirely
      # from the committed analysis/data/*.csv. That is the strongest statement this repo can
      # make in CI, and it is the reader's experience exactly.
      #
      # The reproduce tiers skip here by design -- they need activations/ (~1.3 GB from the
      # GPU extraction) and a populated results/, neither of which belongs in CI. Each names
      # what it wants in its skip message; -rs prints them so a green run is never mistaken
      # for a run that tested more than it did.
      - name: Test
        run: pytest --runslow -rs
